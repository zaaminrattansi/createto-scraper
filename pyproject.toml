[project]
name = "createto-scraper"
version = "0.1.0"
description = "Re-runnable CreateTO scraper: pages + linked files -> versioned, source-cited dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "typer>=0.12",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
createto = "createto.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["createto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
